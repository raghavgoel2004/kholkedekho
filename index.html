<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just One Question ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  height: 100svh;
  font-family: Arial, sans-serif;
  background: #000;
  color: white;
  overflow: hidden;
}

/* FIRST SCREEN */
.box {
  height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 30px;
  margin-bottom: 10px;
}

h2 {
  font-size: 18px;
  font-weight: normal;
  margin-bottom: 25px;
}

button {
  padding: 14px 28px;
  font-size: 17px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

#yes {
  background: #e63946;
  color: white;
}

#no {
  background: #555;
  color: white;
  margin-left: 10px;
}
</style>
</head>

<body>

<div class="box">
  <h1>Hey Chetna Verma ji ❤️</h1>
  <h2>Will you be my Parvatiji forever? 🌙</h2>
  <div>
    <button id="yes" onclick="finalYes()">Yes</button>
    <button id="no">No</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
let noClicks = 0;

noBtn.addEventListener("click", () => {
  noClicks++;
  if (noClicks >= 4) {
    finalYes();
    return;
  }
  noBtn.style.position = "absolute";
  noBtn.style.left = Math.random() * (window.innerWidth - 120) + "px";
  noBtn.style.top = Math.random() * (window.innerHeight - 80) + "px";
});

function finalYes() {
  document.body.innerHTML = `
  <div class="slideshow">
    <img src="img1.png" class="slide s1">
    <img src="img2.png" class="slide s2">
    <img src="img3.png" class="slide s3">
    <img src="img4.png" class="slide s4">
    <img src="img5.png" class="slide s5">
  </div>

  <div class="final-box">
    <h1>Jaan ❤️</h1>

    <p>
      Yeh koi mazak nahi hai<br>
      Na yeh koi game hai. Sirf mera pyaar or feelings hai
      <br><br>
      Iss duniya mein,<br>
      jahan log sirf matlab ke liye aate jaate rehte hain,<br>
      <strong>tum hamesha se mere saath rahi ho.</strong>
      <br><br>
      Tum mere liye koi option nahi ho.<br>
      Tum meri woh choice ho<br>
      jo main har baar karta hoon.
      <br><br>
      Chahe zindagi mujhe hazaar mauke de kisi aur ke liye,<br>
      main hamesha tumhare saath rehna chahunga.
      <br><br>
      Aur agar abhi nahi…<br>
      toh main intezaar karunga.<br>
      Tum mano ya na mano,<br>
      <strong>main tumhara intezaar karunga.</strong>
    </p>

    <h2>Meri Parvatiji 🌙💕<br>I love you meri Shreeji❤️😘</h2>
  </div>

<style>
.slideshow {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  animation: fade 10s infinite;
}

/* 2 seconds per image */
.s1 { animation-delay: 0s; }
.s2 { animation-delay: 2s; }
.s3 { animation-delay: 4s; }
.s4 { animation-delay: 6s; }
.s5 { animation-delay: 8s; }

@keyframes fade {
  0%   { opacity: 0; }
  10%  { opacity: 1; }
  30%  { opacity: 1; }
  40%  { opacity: 0; }
  100% { opacity: 0; }
}

/* SOFT BLUR (NOT HEAVY) */
.final-box {
  position: relative;
  z-index: 2;
  height: 100svh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 22px;

  background: rgba(0,0,0,0.18);
  backdrop-filter: blur(1.5px);
  -webkit-backdrop-filter: blur(1.5px);
}

.final-box h1 {
  font-size: 32px;
}

.final-box p {
  font-size: 17px;
  line-height: 1.6;
  max-width: 95%;
}

.final-box h2 {
  margin-top: 22px;
  font-size: 18px;
  font-weight: normal;
}
</style>
`;
}
</script>

</body>
</html>
