<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just One Question ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  height: 100svh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f0f0f, #000);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  overflow: hidden;
}

.box {
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 30px;
  margin-bottom: 10px;
}

h2 {
  font-size: 18px;
  font-weight: normal;
  margin-bottom: 25px;
}

button {
  padding: 14px 28px;
  font-size: 17px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

#yes {
  background: #e63946;
  color: white;
}

#no {
  background: #555;
  color: white;
  margin-left: 10px;
}
</style>
</head>

<body>

<div class="box">
  <h1>Hey CHETNA Verma ❤️</h1>
  <h2>Will you be my Parvatiji forever? 🌙</h2>
  <button id="yes" onclick="finalYes()">Yes</button>
  <button id="no">No</button>
</div>

<script>
const noBtn = document.getElementById("no");
let noClicks = 0;

noBtn.addEventListener("click", () => {
  noClicks++;

  if (noClicks >= 4) {
    finalYes();
    return;
  }

  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 80);
  noBtn.style.position = "absolute";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

function finalYes() {
  document.body.innerHTML = `
  <div class="slideshow">
    <div class="slide s1"></div>
    <div class="slide s2"></div>
    <div class="slide s3"></div>
    <div class="slide s4"></div>
    <div class="slide s5"></div>
  </div>

  <div class="final-box">
    <h1>CHETNA ❤️</h1>

    <p>
      Yeh koi mazak nahi tha.<br>
      Yeh koi game nahi tha.
      <br><br>
      Iss duniya mein,<br>
      jahan log sirf matlab ke liye aate–jaate rehte hain,<br>
      <strong>tum hamesha se mere saath rahi ho.</strong>
      <br><br>
      Tum mere liye koi option nahi ho.<br>
      Tum meri woh choice ho<br>
      jo main har baar karta hoon,<br>
      jise main dil se maanta hoon, poojta hoon.
      <br><br>
      Chahe zindagi mujhe hazaar mauke de kisi aur ke liye,<br>
      main hamesha tumhare saath rehna chahunga.
      <br><br>
      Aur agar abhi nahi…<br>
      toh main intezaar karunga.<br>
      Tum mano ya na mano,<br>
      <strong>main tumhara intezaar karunga.</strong>
    </p>

    <h2>Meri Parvatiji 🌙💕<br>I love you ❤️😘</h2>
  </div>

<style>
body {
  margin: 0;
  height: 100svh;
  overflow: hidden;
}

.slideshow {
  position: fixed;
  inset: 0;
  z-index: -1;
}

.slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  animation: fade 25s infinite;
}

.s1 { background-image: url('img1.png'); animation-delay: 0s; }
.s2 { background-image: url('img2.png'); animation-delay: 5s; }
.s3 { background-image: url('img3.png'); animation-delay: 10s; }
.s4 { background-image: url('img4.png'); animation-delay: 15s; }
.s5 { background-image: url('img5.png'); animation-delay: 20s; }

@keyframes fade {
  0% { opacity: 0; }
  12% { opacity: 1; }
  30% { opacity: 1; }
  42% { opacity: 0; }
  100% { opacity: 0; }
}

.final-box {
  height: 100svh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 22px;
  background: rgba(0,0,0,0.28);
  backdrop-filter: blur(4px);
}

.final-box h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

.final-box p {
  font-size: 17px;
  line-height: 1.65;
  max-width: 95%;
}

.final-box h2 {
  margin-top: 22px;
  font-size: 18px;
  font-weight: normal;
}
</style>
`;
}
</script>

</body>
</html>
